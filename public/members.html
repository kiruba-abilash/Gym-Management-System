<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Management System - Members</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    background: #111827;
    padding-top: 25px;
}

.sidebar h2 {
    color: white;
    text-align: center;
    margin: 0 0 30px;
    font-size: 22px;
    letter-spacing: 1px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 15px 25px;
    font-size: 16px;
}

.sidebar a:hover {
    background: #1f2937;
    color: white;
}

.sidebar a.active {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

header {
    margin-left: 230px;
}

.container {
    margin-left: 230px;
}
body {
    background:
        linear-gradient(
            rgba(241, 245, 249, 0.78),
            rgba(241, 245, 249, 0.78)
        ),
        url("images/dashboard-bg.jpg")
        center center / cover fixed no-repeat;
}

.container {
    background: rgba(255, 255, 255, 0.84);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

table {
    background: rgba(255, 255, 255, 0.95);
}

input,
select {
    background: rgba(255, 255, 255, 0.96);
}

.sidebar {
    background: linear-gradient(
        180deg,
        #0f172a,
        #111827
    );
    box-shadow: 5px 0 25px rgba(0, 0, 0, 0.15);
}
/* Members Page Professional Upgrade */

.container {
    background:
        linear-gradient(
            rgba(255, 255, 255, 0.78),
            rgba(255, 255, 255, 0.78)
        ),
        url("images/dashboard-bg.jpg")
        center center / cover fixed no-repeat;

    min-height: 100vh;
}

form {
    background: rgba(255, 255, 255, 0.88);
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
}

table {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
}

button {
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    transform: translateY(-2px);
}

form button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}
/* Edit Button */
table td button:first-child {
    background: #2563eb;
    color: white;
    font-weight: 600;
}

table td button:first-child:hover {
    background: #1d4ed8;
}

/* Delete Button */
table td button:last-child {
    background: #dc2626;
    color: white;
    font-weight: 600;
}

table td button:last-child:hover {
    background: #b91c1c;
}
    </style>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="sidebar">
    <h2>🏋️ GYM SYSTEM</h2>

    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/members.html" class="active">👥 Members</a>
    <a href="/trainers.html">🏋️ Trainers</a>
    <a href="/packages.html">📦 Packages</a>
    <a href="/memberships.html">🎫 Memberships</a>
    <a href="/attendance.html">✅ Attendance</a>
    <a href="/payments.html">💳 Payments</a>
    <a href="/reports.html">📊 Reports</a>
</div>

    <header>
        <h1>Gym Management System</h1>
        <p>Members Management</p>

        <button
    class="logout-btn"
    onclick="fetch('/api/logout', { method: 'POST' })
        .then(response => {
            if (response.ok) {
                window.location.href = '/login.html';
            } else {
                alert('Logout failed');
            }
        })
        .catch(() => alert('Server error'))"
>
    Logout
</button>
    </header>

    <div class="container">

        <h2>Members List</h2>

        <input
    type="text"
    id="memberSearch"
    placeholder="Search member by name, phone or email..."
>

        <div style="background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px;">

    <h2>Add New Member</h2>

    <form id="memberForm">

        <input
    type="text"
    id="name"
    placeholder="Member Name"
    pattern="[A-Za-z ]{3,}"
    title="Name must contain only letters and at least 3 characters"
    required
>

        <input
    type="tel"
    id="phone"
    placeholder="Phone"
    pattern="[0-9]{10}"
    maxlength="10"
    required
>

        <input
    type="email"
    id="email"
    placeholder="Email"
    required
>

        <select id="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <input
    type="date"
    id="date_of_birth"
    max="2026-10-07"
    required
>

        <button type="submit">
            Add Member
        </button>

    </form>

    <p id="message"></p>

</div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Gender</th>
                    <th>Date of Birth</th>
                    <th>Joined Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="membersTable">
            </tbody>

        </table>

    </div>

    <script>

        async function checkLogin() {
    const response = await fetch("/api/session");

    if (!response.ok) {
        window.location.href = "/login.html";
        return false;
    }

    return true;
}

        async function loadMembers() {

            try {

                const response = await fetch("/api/members");

                const members = await response.json();

                const table = document.getElementById("membersTable");

                table.innerHTML = "";

                members.forEach(member => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
    <td>${member.id}</td>
    <td>${member.name}</td>
    <td>${member.phone || ""}</td>
    <td>${member.email || ""}</td>
    <td>${member.gender || ""}</td>
    <td>${member.date_of_birth ? new Date(member.date_of_birth).toLocaleDateString() : ""}</td>
    <td>${member.joined_date ? new Date(member.joined_date).toLocaleDateString() : ""}</td>
    <td>
        <button onclick="editMember(${member.id})">
            Edit
         </button>

        <button onclick="deleteMember(${member.id})">
            Delete
        </button>
    </td>
`;

                    table.appendChild(row);

                });

            } catch (error) {

                console.error("Error loading members:", error);

            }

        }

        checkLogin().then(() => {
    loadMembers();
});
document.getElementById("memberSearch")
.addEventListener("input", function () {

    const searchValue = this.value.toLowerCase();

    const rows =
        document.querySelectorAll("#membersTable tr");

    rows.forEach(row => {

        const rowText =
            row.textContent.toLowerCase();

        if (rowText.includes(searchValue)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });

});

    document.getElementById("memberForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();

    const phonePattern = /^[0-9]{10}$/;
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!phonePattern.test(phone)) {
        alert("Phone number must contain exactly 10 digits.");
        return;
    }

    if (!emailPattern.test(email)) {
        alert("Please enter a valid email address.");
        return;
    }

    // existing member data code continues here

    const memberData = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        gender: document.getElementById("gender").value,
        date_of_birth: document.getElementById("date_of_birth").value
    };

    try {

        const response = await fetch("/api/members", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(memberData)
        });

        const data = await response.json();

        const message = document.getElementById("message");

        if (response.ok) {

            message.textContent = data.message;
            message.style.color = "green";

            document.getElementById("memberForm").reset();

            loadMembers();

        } else {

            message.textContent = data.message;
            message.style.color = "red";

        }

    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "Server error";

    }

});

async function deleteMember(id) {

    const confirmDelete = confirm("Are you sure you want to delete this member?");

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(`/api/members/${id}`, {
            method: "DELETE"
        });

        const data = await response.json();

        if (response.ok) {
            alert(data.message);
            loadMembers();
        } else {
            alert(data.message);
        }

    } catch (error) {
        console.error(error);
        alert("Server error");
    }
}

async function editMember(id) {

    const name = prompt("Enter member name:");
    
    if (!name) {
        return;
    }

    const phone = prompt("Enter phone number:");
    const email = prompt("Enter email:");
    const gender = prompt("Enter gender:");
    const date_of_birth = prompt("Enter date of birth (YYYY-MM-DD):");

    try {

        const response = await fetch(`/api/members/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                phone,
                email,
                gender,
                date_of_birth
            })
        });

        const data = await response.json();

        if (response.ok) {
            alert(data.message);
            loadMembers();
        } else {
            alert(data.message);
        }

    } catch (error) {
        console.error(error);
        alert("Server error");
    }
}

    </script>

</body>
</html>
