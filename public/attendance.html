<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            background: #333;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            gap: 10px;
            margin-bottom: 30px;
        }

        input,
        select,
        button {
            padding: 10px;
            font-size: 15px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
        }
        .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    background: #111827;
    padding-top: 25px;
}

.sidebar h2 {
    color: white;
    text-align: center;
    margin: 0 0 30px;
    font-size: 22px;
    letter-spacing: 1px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 15px 25px;
    font-size: 16px;
}

.sidebar a:hover {
    background: #1f2937;
    color: white;
}

.sidebar a.active {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

body {
    padding: 0;
}

.container {
    max-width: none;
    margin-left: 230px;
    padding: 35px;
    border-radius: 0;
    min-height: 100vh;
}
body {
    background:
        linear-gradient(
            rgba(241, 245, 249, 0.78),
            rgba(241, 245, 249, 0.78)
        ),
        url("images/dashboard-bg.jpg")
        center center / cover fixed no-repeat;
}

.container {
    background:
        linear-gradient(
            rgba(255, 255, 255, 0.78),
            rgba(255, 255, 255, 0.78)
        ),
        url("images/dashboard-bg.jpg")
        center center / cover fixed no-repeat;

    min-height: 100vh;
}

form {
    background: rgba(255, 255, 255, 0.88);
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
}

table {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
}

input,
select {
    background: rgba(255, 255, 255, 0.96);
}

button {
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    transform: translateY(-2px);
}

form button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

table td button:last-child {
    background: #dc2626;
    color: white;
}
header {
    margin-left: 230px;
    background: #222;
    color: white;
    padding: 20px 35px;
    text-align: center;
}
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
    <h2>🏋️ GYM SYSTEM</h2>

    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/members.html">👥 Members</a>
    <a href="/trainers.html">🏋️ Trainers</a>
    <a href="/packages.html">📦 Packages</a>
    <a href="/memberships.html">🎫 Memberships</a>
    <a href="/attendance.html" class="active">✅ Attendance</a>
    <a href="/payments.html">💳 Payments</a>
    <a href="/reports.html">📊 Reports</a>
</div>
<header>
    <h1>Gym Management System</h1>
    <p>Attendance Management</p>
    <button
    class="logout-btn"
    onclick="fetch('/api/logout', { method: 'POST' })
        .then(response => {
            if (response.ok) {
                window.location.href = '/login.html';
            } else {
                alert('Logout failed');
            }
        })
        .catch(() => alert('Server error'))"
>
    Logout
</button>
</header>

<div class="container">

    <h2>Mark Attendance</h2>

    <form id="attendanceForm">

        <label>Member</label>

        <select id="member_id" required>
            <option value="">Select Member</option>
        </select>

        <label>Attendance Date</label>

        <input
            type="date"
            id="attendance_date"
            required
        >

        <label>Check-in Time</label>

        <input
            type="time"
            id="check_in_time"
            required
        >

        <button type="submit">
            Mark Attendance
        </button>

    </form>


    <h2>Attendance Records</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Date</th>
                <th>Check-in Time</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="attendanceTableBody"></tbody>

    </table>

</div>


<script>

    async function checkLogin() {
    const response = await fetch("/api/session");

    if (!response.ok) {
        window.location.href = "/login.html";
        return false;
    }

    return true;
}

async function loadMembers() {

    const response = await fetch("/api/members");

    const members = await response.json();

    const select = document.getElementById("member_id");

    select.innerHTML =
        '<option value="">Select Member</option>';

    members.forEach(member => {

        const option = document.createElement("option");

        option.value = member.id;

        option.textContent = member.name;

        select.appendChild(option);

    });
}


async function loadAttendance() {

    const response = await fetch("/api/attendance");

    const attendance = await response.json();

    const tableBody =
        document.getElementById("attendanceTableBody");

    tableBody.innerHTML = "";

    attendance.forEach(record => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${record.id}</td>

            <td>${record.member_name}</td>

            <td>${record.attendance_date.split("T")[0]}</td>

            <td>${record.check_in_time}</td>

            <td>
                <button
                    class="delete-btn"
                    onclick="deleteAttendance(${record.id})">
                    Delete
                </button>
            </td>
        `;

        tableBody.appendChild(row);

    });
}


document
.getElementById("attendanceForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const member_id =
        document.getElementById("member_id").value;

    const attendance_date =
        document.getElementById("attendance_date").value;

    const check_in_time =
        document.getElementById("check_in_time").value;


    const response = await fetch("/api/attendance", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            member_id,
            attendance_date,
            check_in_time
        })

    });


    const data = await response.json();

    alert(data.message);


    if (response.ok) {

        document
        .getElementById("attendanceForm")
        .reset();

        checkLogin().then(() => {
    loadAttendance();
});

    }

});


async function deleteAttendance(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this attendance record?");

    if (!confirmDelete) {
        return;
    }


    const response =
        await fetch(`/api/attendance/${id}`, {
            method: "DELETE"
        });


    const data = await response.json();

    alert(data.message);


    if (response.ok) {

        loadAttendance();

    }

}


checkLogin().then(() => {
    loadMembers();
    document.getElementById("attendance_date").max =
    new Date().toISOString().split("T")[0];
    loadAttendance();
});

</script>

</body>
</html>
