<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memberships</title>

    <style>
        body {

        }

            gap: 10px;

        }

        input, select, button {

        }

        button {

            color: white;

            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;

        }

        th {
            background: #007bff;

        }

        .delete-btn {
            background: #dc3545;

        }

            background: #28a745;
        }
        .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    background: #111827;
    padding-top: 25px;
}

.sidebar h2 {
    color: white;
    text-align: center;
    margin: 0 0 30px;
    font-size: 22px;
    letter-spacing: 1px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 15px 25px;
    font-size: 16px;
}

.sidebar a:hover {
    background: #1f2937;
    color: white;
}

.sidebar a.active {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

body {
    padding: 0;
}

.container {
    max-width: none;
    margin-left: 230px;
    padding: 35px;
    border-radius: 0;
    min-height: 100vh;
}
body {
    background:
        linear-gradient(
            rgba(241, 245, 249, 0.78),
            rgba(241, 245, 249, 0.78)
        ),
        url("images/dashboard-bg.jpg")
        center center / cover fixed no-repeat;
}

.container {
    background:
        linear-gradient(
            rgba(255, 255, 255, 0.78),
            rgba(255, 255, 255, 0.78)
        ),
        url("images/dashboard-bg.jpg")
        center center / cover fixed no-repeat;

    min-height: 100vh;
}

form {
    background: rgba(255, 255, 255, 0.88);
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
}

table {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
}

input,
select {
    background: rgba(255, 255, 255, 0.96);
}

    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    transform: translateY(-2px);
}

form button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

table td button:first-child {
    background: #2563eb;
    color: white;
}

table td button:last-child {
    background: #dc2626;
    color: white;
}

    margin-left: 230px;
    background: #222;
    color: white;
    padding: 20px 35px;
    text-align: center;
}

    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
    <h2>🏋️ GYM SYSTEM</h2>

    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/members.html">👥 Members</a>
    <a href="/trainers.html">🏋️ Trainers</a>
    <a href="/packages.html">📦 Packages</a>
    <a href="/memberships.html" class="active">🎫 Memberships</a>
    <a href="/attendance.html">✅ Attendance</a>
    <a href="/payments.html">💳 Payments</a>
    <a href="/reports.html">📊 Reports</a>
</div>
<header>
    <h1>Gym Management System</h1>
    <p>Memberships Management</p>
    <button
    class="logout-btn"
    onclick="fetch('/api/logout', { method: 'POST' })
        .then(response => {
            if (response.ok) {
                window.location.href = '/login.html';
            } else {
                alert('Logout failed');
            }
        })
        .catch(() => alert('Server error'))"
>
    Logout
</button>
</header>

<div class="container">
    <h2>Add Membership</h2>

    <form id="membershipForm">

        <label>Member</label>
        <select id="member_id" required>
            <option value="">Select Member</option>
        </select>

        <label>Package</label>
        <select id="package_id" required>
            <option value="">Select Package</option>
        </select>

        <label>Start Date</label>
        <input type="date" id="start_date" required>

        <label>End Date</label>
        <input type="date" id="end_date" required>

        <label>Status</label>
        <select id="status">
            <option value="Active">Active</option>
            <option value="Expired">Expired</option>
            <option value="Cancelled">Cancelled</option>
        </select>

        <button type="submit">Add Membership</button>

    </form>

    <h2>Membership List</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Package</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="membershipTableBody"></tbody>

    </table>

</div>

<script>

    document.getElementById("start_date").addEventListener("change", function() {
    document.getElementById("end_date").min = this.value;
});

    async function checkLogin() {
    const response = await fetch("/api/session");

    if (!response.ok) {
        window.location.href = "/login.html";
        return false;
    }

    return true;
}

async function loadMembers() {

    const response = await fetch("/api/members");
    const members = await response.json();

    const select = document.getElementById("member_id");

    select.innerHTML = '<option value="">Select Member</option>';

    members.forEach(member => {

        const option = document.createElement("option");

        option.value = member.id;
        option.textContent = member.name;

        select.appendChild(option);

    });
}


async function loadPackages() {

    const response = await fetch("/api/packages");
    const packages = await response.json();

    const select = document.getElementById("package_id");

    select.innerHTML = '<option value="">Select Package</option>';

    packages.forEach(pkg => {

        const option = document.createElement("option");

        option.value = pkg.id;
        option.textContent = pkg.package_name;

        select.appendChild(option);

    });
}


async function loadMemberships() {

    const response = await fetch("/api/memberships");

    const memberships = await response.json();

    const tableBody = document.getElementById("membershipTableBody");

    tableBody.innerHTML = "";

    memberships.forEach(membership => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${membership.id}</td>
            <td>${membership.member_name}</td>
            <td>${membership.package_name}</td>
            <td>${membership.start_date.split("T")[0]}</td>
            <td>${membership.end_date.split("T")[0]}</td>
            <td>${membership.status}</td>

            <td>
                <button class="edit-btn"
                    onclick="editMembership(${membership.id})">
                    Edit
                </button>

                <button class="delete-btn"
                    onclick="deleteMembership(${membership.id})">
                    Delete
                </button>
            </td>
        `;

        tableBody.appendChild(row);

    });
}


document.getElementById("membershipForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const member_id = document.getElementById("member_id").value;
    const package_id = document.getElementById("package_id").value;
    const start_date = document.getElementById("start_date").value;
    const end_date = document.getElementById("end_date").value;
    const status = document.getElementById("status").value;

    if (end_date < start_date) {
    alert("End date cannot be before start date.");
    return;
}

    const response = await fetch("/api/memberships", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            member_id,
            package_id,
            start_date,
            end_date,
            status
        })

    });

    const data = await response.json();

    alert(data.message);

    if (response.ok) {

        document.getElementById("membershipForm").reset();

        checkLogin().then(() => {
    loadMemberships();
});
    }

});


async function deleteMembership(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this membership?");

    if (!confirmDelete) return;

    const response = await fetch(`/api/memberships/${id}`, {
        method: "DELETE"
    });

    const data = await response.json();

    alert(data.message);

    if (response.ok) {
        loadMemberships();
    }

}


async function editMembership(id) {

    const start_date =
        prompt("Enter start date (YYYY-MM-DD):");

    if (!start_date) return;

    const end_date =
        prompt("Enter end date (YYYY-MM-DD):");

    if (!end_date) return;

    const status =
        prompt("Enter status (Active / Expired / Cancelled):");


    if (!status) return;

    const response = await fetch(`/api/memberships/${id}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            start_date,
            end_date,
            status
        })

    });

    const data = await response.json();

    alert(data.message);

    if (response.ok) {
        loadMemberships();
    }

}


checkLogin().then(() => {
    loadMembers();
    loadPackages();
    loadMemberships();
});

</script>

</body>
</html>
