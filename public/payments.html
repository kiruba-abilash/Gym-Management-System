</head>

<body>
    <div class="sidebar">
    <h2>🏋️ GYM SYSTEM</h2>

    <a href="/dashboard.html">🏠 Dashboard</a>
    <a href="/members.html">👥 Members</a>
    <a href="/trainers.html">🏋️ Trainers</a>
    <a href="/packages.html">📦 Packages</a>
    <a href="/memberships.html">🎫 Memberships</a>
    <a href="/attendance.html">✅ Attendance</a>

    <a href="/reports.html">📊 Reports</a>
</div>
<header>
    <h1>Gym Management System</h1>
    <p>Payments Management</p>
   <button
    class="logout-btn"
    onclick="fetch('/api/logout', { method: 'POST' })
        .then(response => {
            if (response.ok) {
                window.location.href = '/login.html';
            } else {
                alert('Logout failed');
            }
        })
        .catch(() => alert('Server error'))"
>
    Logout
</button>
</header>

<div class="container">

    <h2>Add Payment</h2>

    <form id="paymentForm">

        <label>Member</label>

        <select id="member_id" required>

            <option value="">
                Select Member
            </option>

        </select>


        <label>Amount</label>

        <input
    type="number"
    id="amount"
    placeholder="Amount"
    min="1"
    step="0.01"
    required
>


        <label>Payment Date</label>

        <input
            type="date"
            id="payment_date"
            required
        >


        <label>Payment Method</label>

        <select id="payment_method" required>

            <option value="">
                Select Payment Method
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="Card">
                Card
            </option>

            <option value="Bank Transfer">
                Bank Transfer
            </option>

            <option value="Online">
                Online
            </option>

        </select>


        <button type="submit">
            Add Payment
        </button>

    </form>


    <h2>Payment Records</h2>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Payment Method</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="paymentTableBody"></tbody>

    </table>

</div>


<script>

    async function checkLogin() {
    const response = await fetch("/api/session");

    if (!response.ok) {
        window.location.href = "/login.html";
        return false;
    }

    return true;
}

async function loadMembers() {

    const response =
        await fetch("/api/members");

    const members =
        await response.json();

    const select =
        document.getElementById("member_id");

    select.innerHTML =
        '<option value="">Select Member</option>';


    members.forEach(member => {

        const option =
            document.createElement("option");

        option.value =
            member.id;

        option.textContent =
            member.name;

        select.appendChild(option);

    });

}


async function loadPayments() {

    const response =
        await fetch("/api/payments");

    const payments =
        await response.json();

    const tableBody =
        document.getElementById("paymentTableBody");

    tableBody.innerHTML = "";


    payments.forEach(payment => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${payment.id}</td>

            <td>${payment.member_name}</td>

            <td>${payment.amount}</td>

            <td>${payment.payment_date.split("T")[0]}</td>

            <td>${payment.payment_method || ""}</td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deletePayment(${payment.id})">

                    Delete

                </button>

            </td>

        `;


        tableBody.appendChild(row);

    });

}


document
.getElementById("paymentForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const member_id =
        document.getElementById("member_id").value;

    const amount =
        document.getElementById("amount").value;

    const payment_date =
        document.getElementById("payment_date").value;

    const payment_method =
        document.getElementById("payment_method").value;


    const response =
        await fetch("/api/payments", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                member_id,
                amount,
                payment_date,
                payment_method

            })

        });


    const data =
        await response.json();


    alert(data.message);


    if (response.ok) {

        document
        .getElementById("paymentForm")
        .reset();

        loadPayments();

    }

});


async function deletePayment(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this payment?"
        );


    if (!confirmDelete) {
        return;
    }


    const response =
        await fetch(`/api/payments/${id}`, {

            method: "DELETE"

        });


    const data =
        await response.json();


    alert(data.message);


    if (response.ok) {

        loadPayments();

    }

}


checkLogin().then(() => {
    loadMembers();
    loadPayments();
});

</script>

</body>
